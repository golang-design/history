# Builds the website from README.md and README_cn.md and deploys it
# on every push to main.

name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
        id: go

      - name: build
        env:
          USER: ${{ secrets.SERVER_USER }}
          TARGET: ${{ secrets.SERVER_PATH }}
          KEY: ${{ secrets.SERVER_KEY }}
          DOMAIN: ${{ secrets.SERVER_DOMAIN }}
        run: |
          go run .
          mkdir ~/.ssh
          echo "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 400 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          ssh-keyscan -H $DOMAIN >> ~/.ssh/known_hosts
          scp -r public/* $USER@$DOMAIN:$TARGET
          # scp does not delete: remove what the old single-page site shipped.
          ssh $USER@$DOMAIN "cd '$TARGET' && rm -f style.css dark.js bootstrap.css && { rmdir assets 2>/dev/null || true; }"
